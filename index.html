<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Calculator - By Code Traversal</title>
  </head>
  <body>
    <div class="container">

      <!-- NEW: Theme Toggle Button -->
      <button id="themeToggle" type="button">☀️ Light Mode</button>

      <div class="calculator">
        <input type="text" id="inputBox" placeholder="0" />
        <div>
          <button class="button operator">AC</button>
          <button class="button operator">DEL</button>
          <button class="button operator">%</button>
          <button class="button operator">/</button>
        </div>
        <div>
          <button class="button">7</button>
          <button class="button">8</button>
          <button class="button">9</button>
          <button class="button operator">*</button>
        </div>
        <div>
          <button class="button">4</button>
          <button class="button">5</button>
          <button class="button">6</button>
          <button class="button operator">-</button>
        </div>
        <div>
          <button class="button">1</button>
          <button class="button">2</button>
          <button class="button">3</button>
          <button class="button operator">+</button>
        </div>

        <div>
          <button class="button">00</button>
          <button class="button">0</button>
          <button class="button">.</button>
          <button class="button equalBtn">=</button>
          <div class="scientific-buttons">

  <button class="scientific-button" data-scientific="sqrt">√</button>
  <button class="scientific-button" data-scientific="square">x²</button>
  <button class="scientific-button" data-scientific="sin">sin</button>
  <button class="scientific-button" data-scientific="cos">cos</button>

  <button class="scientific-button" data-scientific="tan">tan</button>
  <button class="scientific-button" data-scientific="log">log</button>
  <button class="scientific-button" data-scientific="ln">ln</button>
  <button class="scientific-button" data-scientific="pi">π</button>

  <button class="scientific-button" data-scientific="e">e</button>
  <button class="scientific-button" data-scientific="reciprocal">1/x</button>

</div>
        </div>
      </div>
            <!-- Calculation History -->
      <div class="history">

        <div class="history-header">
          <h3>Calculation History</h3>
          <button id="clearHistory">Clear History</button>
        </div>

        <ul id="historyList"></ul>

      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
